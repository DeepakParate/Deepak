<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Cloud Engineer | Expressive Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* ===============================
   MATERIAL 3 EXPRESSIVE THEME
================================= */

:root {
    --primary: #7c3aed;
    --primary-dark: #5b21b6;
    --accent: #22d3ee;
    --accent-warm: #f472b6;
    --accent-green: #34d399;
    --bg-dark: #0f0f1b;
    --bg-card: #1a1a2e;
    --bg-elevated: #24243e;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --border: rgba(255,255,255,0.08);
}

/* Reset */
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: radial-gradient(circle at 20% 30%, #7c3aed22, transparent 40%),
                radial-gradient(circle at 80% 70%, #22d3ee22, transparent 40%),
                radial-gradient(circle at 50% 50%, #f472b622, transparent 50%),
                var(--bg-dark);
    color: var(--text-primary);
    overflow-x: hidden;
}

/* Aurora animated layer */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: conic-gradient(
        from 0deg,
        #7c3aed33,
        #22d3ee33,
        #34d39933,
        #f472b633,
        #7c3aed33
    );
    animation: rotateBg 25s linear infinite;
    z-index: -2;
}

@keyframes rotateBg {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Floating particles */
.floating-particles::before,
.floating-particles::after {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image: radial-gradient(#22d3ee55 2px, transparent 2px);
    background-size: 60px 60px;
    animation: floatParticles 60s linear infinite;
    z-index:-1;
}

.floating-particles::after {
    background-image: radial-gradient(#7c3aed55 2px, transparent 2px);
    animation-direction: reverse;
}

@keyframes floatParticles {
    from { transform: translateY(0); }
    to { transform: translateY(-200px); }
}

/* Cursor Glow */
.cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, #22d3ee33, transparent 70%);
    transform: translate(-50%, -50%);
    z-index: -1;
}

/* NAVIGATION */
nav {
    position:fixed;
    top:0;
    width:100%;
    padding:20px 5%;
    backdrop-filter: blur(20px);
    background: rgba(20,20,40,0.5);
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
}

nav h2 {
    background: linear-gradient(90deg,var(--accent),var(--primary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav ul {
    list-style:none;
    display:flex;
    gap:30px;
}

nav a {
    text-decoration:none;
    color:var(--text-secondary);
    transition:0.3s;
}

nav a:hover {
    color:var(--accent);
}

/* HERO */
.hero {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
}

.hero h1 {
    font-size:4rem;
    background: linear-gradient(90deg,var(--primary),var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p {
    margin-top:20px;
    font-size:1.3rem;
    color:var(--text-secondary);
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px;
    margin-top:40px;
    transition:0.4s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow:0 20px 60px rgba(124,58,237,0.3);
}

/* BUTTON */
.btn {
    margin-top:30px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover {
    transform:scale(1.05);
}

/* Responsive */
@media(max-width:768px){
    .hero h1{ font-size:2.5rem; }
}
</style>
</head>

<body>

<div class="floating-particles"></div>
<div class="cursor-glow"></div>

<nav>
    <h2>&lt;/anudeep&gt;</h2>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Skills</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div>
        <h1>Hybrid Cloud Engineer</h1>
        <p>VMware Administration | Windows Server Specialist</p>

        <div class="card">
            <h3>Enterprise Infrastructure Architect</h3>
            <p>Managing 2000+ VMs | 9000+ Windows Servers | 800+ Physical Servers</p>
            <button class="btn">Explore Projects</button>
        </div>
    </div>
</section>

<script>
const glow = document.querySelector('.cursor-glow');
document.addEventListener('mousemove', (e) => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
});
</script>

</body>
</html>
