<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deepak Parate | Enterprise Cloud Architect</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

/* =============================
   MATERIAL 3 EXPRESSIVE THEME
============================= */

:root {
  --primary: #6750A4;
  --on-primary: #ffffff;
  --surface: #ffffff;
  --background: #f4f2fa;
  --text: #1d1b20;
  --card: rgba(255,255,255,0.65);
  --border-radius: 24px;
}

body.dark {
  --primary: #D0BCFF;
  --surface: #1c1b1f;
  --background: #121212;
  --text: #E6E1E5;
  --card: rgba(28,27,31,0.65);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body {
  background: var(--background);
  color: var(--text);
  overflow-x:hidden;
  transition: 0.4s ease;
}

/* =============================
   PARTICLE NETWORK BACKGROUND
============================= */

canvas {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* =============================
   HERO SECTION
============================= */

.hero {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
}

.hero h1 {
  font-size:60px;
  font-weight:900;
  background: linear-gradient(90deg,#6750A4,#00c6ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.typing {
  font-size:22px;
  margin-top:15px;
  font-weight:600;
  color:var(--primary);
}

.btn {
  margin-top:30px;
  padding:14px 28px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  font-weight:600;
  background:var(--primary);
  color:white;
  transition:0.3s;
}

.btn:hover {
  transform:scale(1.05);
}

/* =============================
   CARD DESIGN
============================= */

.section {
  padding:100px 10%;
}

.card {
  background:var(--card);
  backdrop-filter: blur(25px);
  border-radius:var(--border-radius);
  padding:40px;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
  margin-bottom:40px;
  transition:0.3s;
}

.card:hover {
  transform:translateY(-10px);
}

/* =============================
   SKILL BARS
============================= */

.skill {
  margin-bottom:25px;
}

.skill-name {
  margin-bottom:8px;
  font-weight:600;
}

.progress {
  height:12px;
  background:rgba(0,0,0,0.1);
  border-radius:20px;
  overflow:hidden;
}

.progress-bar {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6750A4,#00c6ff);
  border-radius:20px;
  transition:2s ease;
}

/* =============================
   TOGGLE
============================= */

.toggle {
  position:fixed;
  top:20px;
  right:20px;
  cursor:pointer;
  background:var(--primary);
  color:white;
  padding:10px 18px;
  border-radius:50px;
  font-weight:600;
}

/* =============================
   RESPONSIVE
============================= */

@media(max-width:768px){
  .hero h1 { font-size:40px; }
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="toggle" onclick="toggleTheme()">🌗 Theme</div>

<section class="hero">
  <h1>Deepak Parate</h1>
  <div class="typing" id="typing"></div>
  <button class="btn">Download Resume</button>
</section>

<section class="section">
  <div class="card">
    <h2>Enterprise Skills</h2>

    <div class="skill">
      <div class="skill-name">VMware vSphere 8</div>
      <div class="progress"><div class="progress-bar" data-width="95%"></div></div>
    </div>

    <div class="skill">
      <div class="skill-name">Microsoft Azure</div>
      <div class="progress"><div class="progress-bar" data-width="90%"></div></div>
    </div>

    <div class="skill">
      <div class="skill-name">AWS Cloud</div>
      <div class="progress"><div class="progress-bar" data-width="85%"></div></div>
    </div>

  </div>
</section>

<script>

/* =============================
   PARTICLE NETWORK
============================= */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    vx: (Math.random()-0.5)*1,
    vy: (Math.random()-0.5)*1
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;

    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle="#6750A4";
    ctx.fill();

    particles.forEach(p2=>{
      let dx=p.x-p2.x;
      let dy=p.y-p2.y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle="rgba(103,80,164,0.2)";
        ctx.stroke();
      }
    });
  });

  requestAnimationFrame(animate);
}
animate();

/* =============================
   TYPING EFFECT
============================= */

const texts=["Enterprise Cloud Architect",
             "VMware Infrastructure Expert",
             "Azure & AWS Specialist"];

let count=0;
let index=0;
let currentText="";
let letter="";

(function type(){
  if(count===texts.length) count=0;
  currentText=texts[count];
  letter=currentText.slice(0,++index);

  document.getElementById("typing").textContent=letter;

  if(letter.length===currentText.length){
    count++;
    index=0;
    setTimeout(type,1000);
  } else {
    setTimeout(type,80);
  }
})();

/* =============================
   SKILL BAR ANIMATION
============================= */

const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const bars=document.querySelectorAll(".progress-bar");
      bars.forEach(bar=>{
        bar.style.width=bar.dataset.width;
      });
    }
  });
});

observer.observe(document.querySelector(".section"));

/* =============================
   DARK LIGHT TOGGLE
============================= */

function toggleTheme(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
