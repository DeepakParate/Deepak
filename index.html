<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material 3 Expressive Dynamic UI</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --md-primary: #6750A4;
    --md-secondary: #00C853;
    --md-tertiary: #7B5FFF;
    --md-surface: #FEFBFF;
    --md-on-surface: #1C1B1F;
}

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto Flex', sans-serif;
    min-height: 100vh;
    background: var(--md-surface);
    color: var(--md-on-surface);
    overflow-x: hidden;
    position: relative;
}

/* === Animated Gradient Background === */
.dynamic-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: linear-gradient(
        -45deg,
        #6750A4,
        #7B5FFF,
        #00C853,
        #0066CC
    );
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* === Floating Blur Shapes === */
.shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
    animation: float 12s infinite ease-in-out;
}

.shape1 {
    width: 400px;
    height: 400px;
    background: #00C853;
    top: -100px;
    left: -100px;
}

.shape2 {
    width: 350px;
    height: 350px;
    background: #7B5FFF;
    bottom: -100px;
    right: -100px;
    animation-delay: 3s;
}

@keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(40px); }
}

/* === Mouse Light Effect === */
.mouse-light {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
}

/* === Layout === */
.container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    text-align: center;
}

/* === Glass Card === */
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    padding: 60px;
    border-radius: 32px;
    max-width: 600px;
    color: white;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-10px);
}

/* Typography */
h1 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 20px;
}

p {
    font-size: 18px;
    margin-bottom: 30px;
    opacity: 0.9;
}

/* Button */
.btn {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 100px;
    background: white;
    color: #6750A4;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s ease;
}

.btn:hover {
    background: #f2f2f2;
    transform: scale(1.05);
}

@media(max-width:768px){
    h1 { font-size: 32px; }
    .card { padding: 40px; }
}
</style>
</head>
<body>

<div class="dynamic-bg"></div>
<div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="mouse-light" id="mouseLight"></div>

<div class="container">
    <div class="card">
        <h1>Material 3 Expressive UI</h1>
        <p>
            Dynamic animated gradient background with floating glass morphism design 
            and interactive mouse light effect.
        </p>
        <a href="#" class="btn">Explore More</a>
    </div>
</div>

<script>
/* Mouse Light Follow */
const mouseLight = document.getElementById("mouseLight");

document.addEventListener("mousemove", (e) => {
    mouseLight.style.left = e.clientX + "px";
    mouseLight.style.top = e.clientY + "px";
});
</script>

</body>
</html>
